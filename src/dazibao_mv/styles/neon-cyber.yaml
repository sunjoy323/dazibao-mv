name: neon-cyber
description: Strobe edge-columns + glitch punch — cyan/magenta neon (not just a color swap)
mode: neon
decor: true
bg: [6, 8, 14]
shadow_offset: [0, 0]
font: /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
layouts: [neon_col_left, neon_col_right, neon_stack_center, giant_char]
punch:
