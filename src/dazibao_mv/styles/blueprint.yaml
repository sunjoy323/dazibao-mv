name: blueprint
description: Drafting-grid measured reveal — titleblock / H-V rules / corners (motion ≠ color)
mode: blueprint
decor: true
bg: [12, 52, 110]
shadow_offset: [2, 2]
font: /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
layouts: [blueprint_titleblock, blueprint_h_rule, blueprint_v_rule, blueprint_corner]
punch:
  kind: slide
  amount: 1.0
gap_mode: hold
fill: grid
hold_opacity: 0.30
reveal_frac: 0.55
max_per_char: 0.32
verse:
  fill: [220, 240, 255, 255]
  shadow: [80, 160, 220, 160]
  accent: [140, 210, 255, 180]
  box: [12, 52, 110, 0]
chorus:
  fill: [235, 250, 255, 255]
  shadow: [100, 180, 230, 180]
  accent: [160, 220, 255, 200]
  box: [12, 52, 110, 0]
hook:
  fill: [255, 255, 255, 255]
  shadow: [0, 200, 255, 200]
  accent: [180, 240, 255, 220]
  box: [12, 52, 110, 0]
hook_keywords: [长得好笑不行吗, 这难道不算一种漂亮吗, 还没开口已经自带鼓掌]
chorus_keywords: [长得好笑不行吗, 这难道不算一种漂亮吗, 自带鼓掌, 冷场救援]
